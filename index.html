    <style>
        /* ===== MODERN DESIGN SYSTEM TOKENS & RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #1a2a6c;
            --secondary: #b21f1f;
            --accent: #fdbb2d;
            --accent-glow: rgba(253, 187, 45, 0.25);
            --dark: #0f111a;
            --dark-surface: rgba(18, 18, 24, 0.92);
            --dark-card: rgba(26, 30, 46, 0.8);
            --light: #f8fafc;
            --light-muted: #cbd5e1;
            --text-dim: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-accent: rgba(253, 187, 45, 0.3);
            
            --h1-size: clamp(2.2rem, 5vw, 3.6rem);
            --h2-size: clamp(1rem, 2vw, 1.25rem);
            --h3-size: clamp(1.25rem, 3vw, 1.75rem);
            --section-title-size: clamp(1.75rem, 4vw, 2.5rem);
            --body-size: clamp(0.95rem, 1.5vw, 1.05rem);
            
            --header-height: 80px;
            --container-max: 1200px;
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            
            --z-back: -1;
            --z-normal: 1;
            --z-header: 1000;
            --z-floating: 8000;
            --z-modal: 9000;
            --z-loader: 10000;
            --z-cursor: 99999;
        }

        html { 
            scroll-behavior: smooth; 
            scroll-padding-top: var(--header-height);
        }
        
        body {
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            background-attachment: fixed;
            color: var(--light);
            line-height: 1.6;
            overflow-x: hidden;
            cursor: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }
        
        .container { 
            max-width: var(--container-max); 
            margin: 0 auto; 
            padding: 0 20px; 
            width: 100%;
        }

        /* ACCESSIBLE FOCUS VISIBLE RINGS (WCAG AA) */
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 4px;
        }

        /* LOADING SCREEN */
        .loader-overlay {
            position: fixed; inset: 0; background: var(--dark); z-index: var(--z-loader);
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .loader-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-ring {
            width: 70px; height: 70px; border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--accent);
            border-right-color: var(--secondary);
            animation: spinLoader 1s linear infinite;
        }
        .loader-text {
            margin-top: 20px; font-size: 1.1rem; font-weight: 600;
            background: linear-gradient(to right, var(--accent), var(--secondary), var(--accent));
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 2s linear infinite;
        }
        @keyframes spinLoader { to { transform: rotate(360deg); } }
        @keyframes shimmer { to { background-position: 200% center; } }

        /* CUSTOM CURSOR & TOUCH FALLBACK */
        .cursor-dot { 
            position: fixed; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; 
            pointer-events: none; z-index: var(--z-cursor); transform: translate(-50%, -50%); 
            transition: width 0.2s, height 0.2s, background 0.2s; mix-blend-mode: difference; 
        }
        .cursor-outline { 
            position: fixed; width: 40px; height: 40px; border: 2px solid rgba(253,187,45,0.6); 
            border-radius: 50%; pointer-events: none; z-index: calc(var(--z-cursor) - 1); 
            transform: translate(-50%, -50%); transition: all 0.15s ease-out; 
        }
        .cursor-outline.hover { width: 56px; height: 56px; border-color: var(--accent); background: rgba(253,187,45,0.12); }
        .cursor-dot.hover { width: 12px; height: 12px; }
        
        @media (hover: none) or (pointer: coarse) or (max-width: 768px) { 
            .cursor-dot, .cursor-outline { display: none !important; } 
            body, button, a, input, textarea { cursor: auto !important; } 
        }

        /* SCROLL PROGRESS BAR */
        .scroll-progress { 
            position: fixed; top: 0; left: 0; height: 3px; 
            background: linear-gradient(to right, var(--accent), var(--secondary), var(--primary)); 
            z-index: calc(var(--z-header) + 1); width: 0%; transition: width 0.1s linear; 
        }

        /* HEADER */
        header {
            padding: 16px 0; position: fixed; width: 100%; top: 0; z-index: var(--z-header);
            background: rgba(15, 17, 26, 0.92); backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border-subtle); transition: all 0.3s ease;
        }
        header.scrolled { padding: 12px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo {
            font-size: 1.6rem; font-weight: 700;
            background: linear-gradient(to right, var(--accent), #ffa726);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 24px; align-items: center; list-style: none; }
        .nav-links a {
            color: var(--light-muted); text-decoration: none; font-weight: 500; font-size: 0.95rem;
            transition: color 0.3s; position: relative; padding: 4px 0;
        }
        .nav-links a:after {
            content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px;
            background: var(--accent); transition: width 0.3s ease;
        }
        .nav-links a:hover:after, .nav-links a.active:after { width: 100%; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .menu-btn { display: none; font-size: 24px; cursor: pointer; color: var(--light); background: none; border: none; }

        /* HERO SECTION */
        .hero {
            min-height: 100vh;
            display: flex; 
            align-items: center; 
            padding-top: calc(var(--header-height) + 40px); 
            padding-bottom: 60px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #160a28 0%, #3a0b25 35%, #701515 65%, #a8350b 85%, #d97706 100%);
        }
        .hero-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0 20px;
            gap: 40px;
        }
        .hero-text-col {
            flex: 1 1 560px;
            max-width: 600px;
            z-index: 5;
        }
        .hero-img-col {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 3;
        }
        .hero-portrait-wrap {
            position: relative;
            width: clamp(260px, 40vw, 380px);
            height: clamp(260px, 40vw, 380px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-portrait-wrap img {
            width: 85%;
            height: 85%;
            border-radius: 50%;
            object-fit: cover; 
            object-position: center top;
            position: relative; 
            z-index: 2;
            border: 4px solid rgba(253, 187, 45, 0.35);
            box-shadow: 0 0 50px rgba(253, 187, 45, 0.25), 0 0 100px rgba(0,0,0,0.5);
        }
        .hero-portrait-wrap::before {
            content: ''; 
            position: absolute; 
            width: 98%; 
            height: 98%; 
            border-radius: 50%;
            border: 2px solid rgba(253, 187, 45, 0.3); 
            z-index: 1;
            animation: rotateRing 20s linear infinite;
        }
        .hero-portrait-wrap::after {
            content: ''; 
            position: absolute; 
            width: 112%; 
            height: 112%; 
            border-radius: 50%;
            border: 1px dashed rgba(253, 187, 45, 0.2); 
            z-index: 0;
            animation: rotateRing 30s linear infinite reverse;
        }
        @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .hero h1 { 
            font-size: var(--h1-size); 
            margin-bottom: 12px; 
            line-height: 1.15; 
            text-shadow: 2px 2px 20px rgba(0,0,0,0.6); 
            font-weight: 800; 
            letter-spacing: -1px; 
            color: #fff;
        }
        .hero h2 { 
            font-size: var(--h2-size); 
            margin-bottom: 20px; 
            color: var(--accent); 
            text-shadow: 1px 1px 10px rgba(0,0,0,0.4); 
            font-weight: 600; 
            letter-spacing: 2.5px; 
            text-transform: uppercase;
        }
        
        /* TYPED ANIMATION (CLS FIX & STABILITY) */
        .hero-subtitle { 
            font-size: var(--h3-size); 
            margin-bottom: 25px; 
            font-weight: 500;
            color: #fff; 
            line-height: 1.35;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .typed-wrapper {
            display: inline-flex;
            align-items: center;
            min-width: clamp(220px, 45vw, 340px);
            min-height: 2.2rem;
            position: relative;
            white-space: nowrap;
        }
        .typed-text { color: var(--accent); font-weight: 700; }
        .typed-cursor { color: var(--accent); font-weight: 400; margin-left: 2px; animation: blinkCursor 0.8s infinite; }
        @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .hero p { 
            font-size: var(--body-size); 
            margin-bottom: 30px; 
            line-height: 1.75; 
            color: rgba(255,255,255,0.92);
            text-shadow: 1px 1px 8px rgba(0,0,0,0.4);
        }
        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white; text-decoration: none; border-radius: var(--radius-full); font-weight: 600;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.3s; 
            border: none; cursor: pointer; text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.4); }
        .btn-outline { 
            background: rgba(15,17,26,0.4); border: 2px solid var(--accent); color: var(--accent); 
            backdrop-filter: blur(8px);
        }
        .btn-outline:hover { background: var(--accent); color: var(--dark); }

        .hero-particles { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
        .particle { position: absolute; border-radius: 50%; animation: floatParticle 6s ease-in-out infinite; }
        @keyframes floatParticle {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            50% { transform: translate(10px, -15px) scale(1.2); opacity: 0.7; }
        }

        /* FLOATING ACTIONS STACK (COLLISION PREVENTION FIX) */
        .floating-actions-stack {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: var(--z-floating);
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            pointer-events: none;
        }
        .floating-btn {
            pointer-events: auto;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: 2px solid rgba(253, 187, 45, 0.4);
            color: var(--accent);
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(253, 187, 45, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.3s, opacity 0.3s, visibility 0.3s;
        }
        .floating-btn:hover {
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 25px rgba(253, 187, 45, 0.4);
            color: #fff;
        }
        .back-to-top-btn {
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px) scale(0.8);
        }
        .back-to-top-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        /* TRUST BADGES BAR */
        .trust-bar {
            background: var(--dark-surface); padding: 28px 0; border-bottom: 1px solid var(--border-subtle);
            position: relative; z-index: 10;
        }
        .trust-bar-content { display: flex; justify-content: center; align-items: center; gap: 40px; flex-wrap: wrap; }
        .trust-item { display: flex; align-items: center; gap: 10px; color: var(--light-muted); font-size: 0.9rem; }
        .trust-item i { color: var(--accent); font-size: 1.2rem; }
        .trust-divider { width: 1px; height: 28px; background: rgba(253,187,45,0.25); }

        /* SECTIONS COMMON */
        section { padding: 90px 0; }
        .section-card { 
            background: var(--dark-surface); 
            backdrop-filter: blur(12px); 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--border-subtle);
            padding: 60px 40px;
            margin: 40px 0; 
        }
        .section-title { 
            text-align: center; font-size: var(--section-title-size); 
            margin-bottom: 50px; position: relative; font-weight: 700; color: #fff;
        }
        .section-title:after {
            content: ''; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 4px; background: linear-gradient(to right, var(--primary), var(--secondary), var(--accent)); border-radius: 2px;
        }

        /* RESPONSIVE BREAKPOINTS (320px, 360px, 375px, 390px, 414px, 768px, 1024px) */
        @media (max-width: 992px) {
            .hero-inner { flex-direction: column-reverse; text-align: center; gap: 30px; }
            .hero-text-col { max-width: 100%; }
            .hero-buttons { justify-content: center; }
            .hero-subtitle { justify-content: center; }
            .typed-wrapper { min-width: 240px; justify-content: center; }
            .about-content, .resume-content { grid-template-columns: 1fr; gap: 40px; }
        }
        @media (max-width: 768px) {
            section { padding: 60px 0; }
            .section-card { padding: 40px 20px; margin: 25px 0; }
            .menu-btn { display: block; }
            .nav-links {
                position: fixed; top: var(--header-height); left: 0; width: 100%;
                background: rgba(15, 17, 26, 0.98); backdrop-filter: blur(20px);
                flex-direction: column; padding: 30px 20px; gap: 20px;
                transform: translateY(-150%); opacity: 0; visibility: hidden;
                transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
                border-bottom: 1px solid var(--border-accent);
            }
            .nav-links.active { transform: translateY(0); opacity: 1; visibility: visible; }
            .floating-actions-stack { bottom: 20px; right: 20px; gap: 10px; }
            .floating-btn { width: 46px; height: 46px; font-size: 1.1rem; }
        }
        @media (max-width: 480px) {
            .container { padding: 0 15px; }
            .btn { width: 100%; margin-left: 0 !important; }
            .hero-subtitle { font-size: 1.25rem; }
            .typed-wrapper { min-width: 200px; }
            .trust-bar-content { gap: 20px; }
            .trust-divider { display: none; }
        }
        @media (max-width: 360px) {
            .hero h1 { font-size: 2rem; }
            .hero h2 { font-size: 0.9rem; letter-spacing: 1.5px; }
            .section-title { font-size: 1.5rem; }
        }
    </style>
